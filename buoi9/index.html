<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <form>
        <label class="form-label">Chọn trình duyệt từ danh sách</label>
        <input class="form-input" list="browsers" name="browser">
        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Safari">
            <option value="Edge">
            <option value="Opera">
        </datalist>
    </form>
    <form class="was-validated">
        <div class="mb-3 mt-3">
            <label for="uname" class="form-label">Họ và tên:</label>
            <input type="text" class="form-control" id="uname" placeholder="Nhập họ tên" required>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Vui lòng điền vào trường này</div>
        </div>
        <div class="mb-3">
            <label for="pwd" class="form-label">Mật khẩu:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Nhập mật khẩu" required>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Vui lòng điền vào trường này</div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="myCheck" required>
            <label class="form-check-label" for="myCheck">Đồng ý với các điều khoản</label>
            <div class="valid-feedback">Hợp lệ</div>
            <div class="invalid-feedback">Tick vào hộp thoại để xác nhận</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <div class="btn-group">
        <button type="button" class="btn btn-primary">Apple</button>
        <button type="button" class="btn btn-success">Samsung</button>
        <div class="btn-group">
            <button type="button" class="btn btn-warning dropdown-toggle" data-bs-toggle="dropdown"> Sony
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Tablet</a></li>
                <li><a class="dropdown-item" href="#">Smartphone</a></li>
            </ul>
        </div>
    </div>
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#home">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#contact">Contact</a>
        </li>
    </ul>
    <!-- Tab panes -->
    <div class="tab-content">
        <div id="home" class="container tab-pane active"><br>
            <p>Nội dung tab Home</p>
        </div>
        <div id="contact" class="container tab-pane fade"><br>
            <p>Nội dung tab Contact</p>
        </div>
    </div>

</body>

</html>
